<script>
/* last-resort trap: catches even syntax errors in the main script below */
window.addEventListener("error", function(e){
  var m = document.getElementById("main");
  if (m && !m.childElementCount) m.innerHTML =
    '<div style="max-width:640px;margin:40px auto;padding:16px;border:2px solid #FF6B5E;border-radius:12px;font-family:monospace;font-size:13px;word-break:break-word">' +
    '<b>Script failed to load:</b><br>' + (e.message || "unknown error") +
    (e.lineno ? " (line " + e.lineno + ")" : "") +
    '<br><br>Most common cause: smart/curly quotes in the SUPABASE constants. They must be straight " quotes.</div>';
});
</script>
